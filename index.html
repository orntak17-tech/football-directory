<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Database Explorer</title>
<style>
:root{--bg:#f3f6f5;--sf:#fff;--tx:#1b2a26;--mu:#5a6c66;--ln:#d8e1de;--ac:#0f6b57;--act:#fff;--hd:#e6efec;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#111a17;--sf:#1a2522;--tx:#e5eeeb;--mu:#98aaa4;--ln:#2d3c38;--ac:#4cc3a4;--act:#0a1411;--hd:#23322e;--er:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
nav h1{font-size:1.05rem;margin:0 8px 10px}
nav h3{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 8px 4px}
nav a{display:block;padding:6px 10px;border-radius:6px;color:var(--tx);text-decoration:none;font-size:.92rem}
nav a:hover{background:var(--hd)}
nav a.on{background:var(--ac);color:var(--act)}
main{padding:20px;min-width:0}
h2{margin:0 0 4px;font-size:1.4rem}
.sub{color:var(--mu);margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;text-decoration:none;color:var(--tx)}
.card:hover{border-color:var(--ac)}
.card b{display:block;font-size:1.5rem}
.card span{color:var(--mu);font-size:.85rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 10px;min-width:220px}
button{font:inherit;background:var(--ac);color:var(--act);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.wrap{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--hd);font-weight:600;position:sticky;top:0}
th.s{cursor:pointer}
tr:hover td{background:var(--hd)}
.pg{display:flex;gap:12px;align-items:center;margin-top:12px;color:var(--mu)}
.er{color:var(--er);padding:14px}
a.lk{color:var(--ac)}
select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.rf label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mu);gap:4px}
.rf label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--tx)}
.rf input,.rf select{min-width:0}
.rf input[type=checkbox]{width:auto}
.er2{color:var(--er)}
@media print{nav,.np,.pg{display:none!important}.app{display:block}}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--ln)}nav h1,nav h3{width:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

var PS = 25, cur = null, page = 0, sortKey = null, asc = true, term = '', timer;
var nav = document.getElementById('nav'), main = document.getElementById('main');

function buildNav(){
  var h = '<h1>⚽ Database Explorer</h1><a href="#home" id="n-home">Overview</a>', g = '';
  TABLES.forEach(t => {
    if (t.g !== g){ g = t.g; h += '<h3>' + e(g) + '</h3>'; }
    h += '<a href="#' + t.id + '" id="n-' + t.id + '">' + e(t.label) + '</a>';
  });
  h += '<h3>Reports</h3><a href="#reports" id="n-reports">📋 Reports</a>';
  nav.innerHTML = h;
}

async function home(){
  main.innerHTML = '<h2>Overview</h2><p class="sub">Click a table to browse it. Counting rows…</p><div class="cards" id="cards"></div>';
  var box = document.getElementById('cards');
  box.innerHTML = '<a class="card" href="#reports"><b>' + REPORTS.length + '</b><span>Reports</span></a>' + TABLES.map(t => '<a class="card" href="#' + t.id + '"><b id="c-' + t.id + '">…</b><span>' + e(t.label) + '</span></a>').join('');
  TABLES.forEach(async t => {
    var r = await db.from(t.id).select('*', {count: t.big ? 'estimated' : 'exact', head: true});
    var el = document.getElementById('c-' + t.id);
    if (el) el.textContent = r.error ? '!' : n(r.count);
  });
}

async function load(){
  var t = cur, from = page * PS;
  var q = db.from(t.id).select(t.sel || '*', {count: t.big ? 'estimated' : 'exact'});
  if (term && t.s) q = q.ilike(t.s, '%' + term + '%');
  var o = (t.o || (t.pk ? [[t.pk, true]] : []));
  if (sortKey) o = [[sortKey, asc]].concat(o.filter(x => x[0] !== sortKey));
  o.forEach(x => { q = q.order(x[0], {ascending: x[1]}); });
  var r = await q.range(from, from + PS - 1);
  var body = document.getElementById('body'), info = document.getElementById('info');
  if (r.error){
    body.innerHTML = '<tr><td class="er" colspan="20">Could not load: ' + e(r.error.message) + '</td></tr>';
    info.textContent = ''; return;
  }
  var rows = r.data, total = r.count == null ? rows.length : r.count;
  body.innerHTML = rows.length
    ? rows.map(x => '<tr>' + t.c.map(c => '<td>' + c[1](x) + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="20" class="sub">No rows found.</td></tr>';
  var pages = Math.max(1, Math.ceil(total / PS));
  info.textContent = (rows.length ? from + 1 : 0) + '–' + (from + rows.length) + ' of ' + n(total) + (t.big ? ' (approx.)' : '') + ' · page ' + (page + 1) + ' of ' + n(pages);
  document.getElementById('prev').disabled = page === 0;
  document.getElementById('next').disabled = from + PS >= total;
}

function show(t){
  cur = t; page = 0; sortKey = null; asc = true; term = '';
  main.innerHTML = '<h2>' + e(t.label) + '</h2><p class="sub">Table: <code>' + e(t.id) + '</code></p>' +
    '<div class="bar">' + (t.s ? '<input id="q" placeholder="Search by ' + e(t.s) + '…">' : '') + '</div>' +
    '<div class="wrap"><table><thead><tr>' +
    t.c.map((c, i) => '<th' + (c[2] ? ' class="s" data-k="' + c[2] + '" title="Click to sort"' : '') + '>' + e(c[0]) + '</th>').join('') +
    '</tr></thead><tbody id="body"><tr><td class="sub" colspan="20">Loading…</td></tr></tbody></table></div>' +
    '<div class="pg"><button id="prev">Previous</button><button id="next">Next</button><span id="info"></span></div>';
  var q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { term = q.value.trim(); page = 0; load(); }, 300); });
  document.getElementById('prev').onclick = () => { page--; load(); };
  document.getElementById('next').onclick = () => { page++; load(); };
  main.querySelectorAll('th.s').forEach(th => th.onclick = () => {
    var k = th.dataset.k; asc = sortKey === k ? !asc : true; sortKey = k; page = 0;
    main.querySelectorAll('th.s').forEach(x => x.textContent = x.textContent.replace(/ [▲▼]$/, ''));
    th.textContent += asc ? ' ▲' : ' ▼'; load();
  });
  load();
}

function showReportPage(r){
  cur = null;
  main.innerHTML = '<p class="sub np"><a class="lk" href="#reports">← All reports</a></p><h2>' + e(r.title) + '</h2><p class="sub">' + e(r.desc) + '</p>' +
    '<form id="rf" class="rf np">' +
    r.p.map((q, i) => q[2] === 'check'
      ? '<label class="ck"><input type="checkbox" id="rp' + i + '"> ' + e(q[1]) + '</label>'
      : '<label>' + e(q[1]) + '<input id="rp' + i + '" type="' + q[2] + '" placeholder="' + e(q[3] || '') + '" value="' + e(q[4] == null ? '' : q[4]) + '"' + (q[2] === 'number' ? ' step="any"' : '') + '></label>').join('') +
    '<button type="submit">Run report</button><button type="button" class="g" id="rpdf">Save as PDF</button></form>' +
    '<p id="rst" class="sub">Set your filters (all optional) and click Run report.</p>' +
    '<div class="wrap"><table><thead id="rth"></thead><tbody id="rtb"></tbody></table></div>';
  var g = id => document.getElementById(id);
  g('rpdf').onclick = () => window.print();
  g('rf').onsubmit = async function(ev){
    ev.preventDefault();
    var params = {};
    r.p.forEach((q, i) => {
      var el = g('rp' + i), v = el.value ? el.value.trim() : '';
      params[q[0]] = q[2] === 'check' ? el.checked : (v === '' ? null : (q[2] === 'number' ? Number(v) : v));
    });
    g('rst').className = 'sub'; g('rst').textContent = 'Running…';
    var res = await db.rpc(r.fn, params);
    g('rth').innerHTML = ''; g('rtb').innerHTML = '';
    if (res.error){ g('rst').className = 'er2'; g('rst').textContent = 'Error: ' + res.error.message; return; }
    var rows = res.data || [];
    if (!rows.length){ g('rst').textContent = 'No rows found for these filters.'; return; }
    var cols = Object.keys(rows[0]);

    g('rtb').innerHTML = rows.map(x => '<tr>' + cols.map(c => '<td>' + d(x[c]) + '</td>').join('') + '</tr>').join('');

  };
}

    if (res.error){ g('rst').className = 'er2'; g('rst').textContent = 'Error: ' + res.error.message; return; }
    var rows = res.data || [];
    if (!rows.length){ g('rst').textContent = 'No rows found for these filters.'; return; }
    var cols = Object.keys(rows[0]);
    g('rth').innerHTML = '<tr>' + cols.map(c => '<th>' + e(c.replace(/_/g, ' ')) + '</th>').join('') + '</tr>';
    g('rtb').innerHTML = rows.map(x => '<tr>' + cols.map(c => '<td>' + d(x[c]) + '</td>').join('') + '</tr>').join('');
    g('rst').textContent = rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' · ' + new Date().toLocaleString();
  };
}

function route(){
  var id = location.hash.slice(1) || 'home';
  var navId = (id === 'reports' || id.indexOf('report-') === 0) ? 'reports' : id;
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.id === 'n-' + navId));
  var t = TABLES.find(x => x.id === id);
  var rp = REPORTS.find(x => 'report-' + x.id === id);
  if (id === 'reports') showReports(); else if (rp) showReportPage(rp); else if (t) show(t); else home();
  window.scrollTo(0, 0);
}

buildNav();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
